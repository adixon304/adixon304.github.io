<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  {% assign page_desc = page.description | default: site.description %}
  {% assign page_title = page.title | default: site.title %}
  {% assign page_url = page.url | prepend: site.url %}

  <meta name="description" content="{{ page_desc | strip_html | strip_newlines | truncate: 160 }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'recipe' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:url" content="{{ page_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 160 }}">

  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="canonical" href="{{ page_url }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
