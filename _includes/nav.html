  <a href="{{ '/' | relative_url }}" class="nav-logo">
    <img src="{{ '/images/logo.png' | relative_url }}" alt="Alex Dixon">
  </a>
  <div class="nav-links">
    <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="nav-active"{% endif %}>About</a>
    <a href="{{ '/recipes' | relative_url }}" {% if page.url contains 'recipes' %}class="nav-active"{% endif %}>Recipes</a>
    <a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}class="nav-active"{% endif %}>Contact</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>
<script>
(function() {
  var btn = document.getElementById('theme-toggle');
  btn.addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  });
})();
</script>
