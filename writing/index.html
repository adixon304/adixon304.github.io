---
layout: default
title: Writing
---
<div class="writing">
  <h1>Writing</h1>
  {% if site.posts.size > 0 %}
    {% for post in site.posts %}
    <div class="post-item">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <time>{{ post.date | date: "%B %-d, %Y" }}</time>
      {% if post.description %}<p>{{ post.description }}</p>{% endif %}
    </div>
    {% endfor %}
  {% else %}
    <p>Nothing here yet — check back soon.</p>
  {% endif %}
</div>
