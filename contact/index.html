---
layout: default
title: Contact
---
<div class="contact-page">
  <h1>Get in touch</h1>
  <p>Have a question, a recipe suggestion, or just want to say hello. Fill out the form below.</p>

  <div data-fs-success class="form-success">
    <span>Thanks for reaching out. I'll get back to you soon.</span>
    <button class="form-success-close" onclick="this.parentElement.style.display='none'" aria-label="Dismiss">&times;</button>
  </div>
  <div data-fs-error class="form-error"></div>

  <form id="contact-form" class="contact-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required data-fs-field />
      <span data-fs-error="name" class="field-error"></span>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required data-fs-field />
      <span data-fs-error="email" class="field-error"></span>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required data-fs-field></textarea>
      <span data-fs-error="message" class="field-error"></span>
    </div>
    <button type="submit" data-fs-submit-btn>Send message</button>
  </form>
</div>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { formElement: '#contact-form', formId: 'mnjlyekg' });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
